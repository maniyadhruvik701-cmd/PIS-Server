<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Access Role - PIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Essential Reset should be inside styles */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 0.15;
            }

            90% {
                opacity: 0.15;
            }

            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }

        .page {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 720px;
            padding: 20px;
        }

        /* --- ROLE SELECT SCREEN --- */
        .role-screen {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .role-screen .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 198, 255, 0.4);
        }

        .role-screen h2 {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .role-screen p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
            margin-bottom: 36px;
        }

        .role-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 500px) {
            .role-cards {
                grid-template-columns: 1fr;
            }

            .role-screen {
                padding: 30px 20px;
            }
        }

        .role-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 20px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .role-card:hover {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .role-card.selected {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.3);
        }

        .role-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .role-info h3 {
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .role-info span {
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.82rem;
        }

        .role-arrow {
            margin-left: auto;
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            transition: all 0.3s;
        }

        .role-card:hover .role-arrow,
        .role-card.selected .role-arrow {
            color: var(--accent);
            transform: translateX(4px);
        }

        /* --- PIN SCREEN --- */
        .pin-screen {
            display: none;
            animation: slideUp 0.4s ease;
        }

        .pin-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .pin-role-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .pin-role-badge.order {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .pin-role-badge.fitting {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pin-role-badge.fullaccess {
            background: rgba(99, 102, 241, 0.2);
            color: #6366f1;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .pin-box h2 {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .pin-box p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .pin-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: transparent;
            transition: all 0.2s ease;
        }

        .pin-dot.filled {
            background: var(--pin-color, #00c6ff);
            border-color: var(--pin-color, #00c6ff);
            box-shadow: 0 0 12px var(--pin-color, #00c6ff);
            transform: scale(1.1);
        }

        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 260px;
            margin: 0 auto 20px;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 500;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .key-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .key-btn:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.2);
        }

        .key-btn.del-btn {
            color: #f87171;
            font-size: 1rem;
        }

        .key-btn.zero-btn {
            grid-column: 2;
        }

        .back-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.45);
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.05);
        }

        .pin-error {
            color: #f87171;
            font-size: 0.88rem;
            margin-top: 12px;
            min-height: 20px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-6px);
            }

            80% {
                transform: translateX(6px);
            }
        }
    </style>
</head>

<body>

    <!-- Animated BG Particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- SCREEN 1: User Select -->
    <div class="role-screen" id="roleScreen">
        <div class="brand-icon"><i class="fas fa-users-cog"></i></div>
        <h2>Select User</h2>
        <p>Select your name to access the dashboard</p>

        <div class="role-cards" id="roleCardsContainer">
            <!-- User Cards will be injected here -->
        </div>


    </div>

    <!-- SCREEN 2: PIN Entry -->
    <div class="pin-screen" id="pinScreen">
        <div class="pin-box">
            <div class="pin-role-badge" id="pinRoleBadge">
                <i class="fas fa-user" id="pinRoleIcon"></i>
                <span id="pinRoleLabel">User</span>
            </div>

            <h2>Enter PIN</h2>
            <p>Hello <span id="helloUserName" style="font-weight: 700; color: white;">User</span>, please enter your PIN
            </p>

            <div class="pin-dots" id="pinDots">
                <div class="pin-dot" id="dot0"></div>
                <div class="pin-dot" id="dot1"></div>
                <div class="pin-dot" id="dot2"></div>
                <div class="pin-dot" id="dot3"></div>
            </div>

            <div class="pin-keypad">
                <button class="key-btn" data-val="1">1</button>
                <button class="key-btn" data-val="2">2</button>
                <button class="key-btn" data-val="3">3</button>
                <button class="key-btn" data-val="4">4</button>
                <button class="key-btn" data-val="5">5</button>
                <button class="key-btn" data-val="6">6</button>
                <button class="key-btn" data-val="7">7</button>
                <button class="key-btn" data-val="8">8</button>
                <button class="key-btn" data-val="9">9</button>
                <button class="key-btn del-btn" id="delBtn"><i class="fas fa-backspace"></i></button>
                <button class="key-btn zero-btn" data-val="0">0</button>
            </div>

            <div class="pin-error" id="pinError"></div>

            <button class="back-btn" id="backBtn">
                <i class="fas fa-arrow-left"></i> Back to User Selection
            </button>
        </div>
    </div>


    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ---- Firebase Configuration ----
        const firebaseConfig = {
            apiKey: "AIzaSyBryHZVts2tNd3PY1inZI5olVOJz0sd3XM",
            authDomain: "piss-297ff.firebaseapp.com",
            databaseURL: "https://piss-297ff-default-rtdb.firebaseio.com",
            projectId: "piss-297ff",
            storageBucket: "piss-297ff.firebasestorage.app",
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const auth = firebase.auth();

        // Use local storage to cache permissions for instant access while cloud syncs
        let userPermissions = JSON.parse(localStorage.getItem('pis_cached_permissions') || '{}');

        // ---- Auth Guard ----
        const currentUserRaw = localStorage.getItem('currentUser');
        if (!currentUserRaw) {
            window.location.href = 'index.html';
        }

        // ---- User Config ----
        const USERS = [
            { id: 'vishal', name: 'Vishal', pin: '2179', isAdmin: true, color: '#6366f1' },
            { id: 'piyush', name: 'Piyush', pin: '2179', isAdmin: true, color: '#8b5cf6' },
            { id: 'amish', name: 'Amish', pin: '1734', color: '#f59e0b' },
            { id: 'arshit', name: 'Arshit', pin: '2491', color: '#10b981' },
            { id: 'manager', name: 'Manager', pin: '1243', color: '#ec4899' },
            { id: 'radhi', name: 'Radhi', pin: '2764', color: '#06b6d4' },
            { id: 'vruti', name: 'Vruti', pin: '3487', color: '#f43f5e' },
            { id: 'bhumi', name: 'Bhumi', pin: '6573', color: '#14b8a6' }
        ];

        // No Default Role Mappings - Permission must be given by Vishal/Piyush in Manage Modal
        // Initialized from cache above

        // ---- State ----
        let selectedUserObj = null;
        let enteredPin = '';
        let isPiyushOrVishal = false;

        // ---- DOM ----
        const roleScreen = document.getElementById('roleScreen');
        const pinScreen = document.getElementById('pinScreen');
        const pinDots = document.querySelectorAll('.pin-dot');
        const pinError = document.getElementById('pinError');
        const pinRoleBadge = document.getElementById('pinRoleBadge');
        const pinRoleLabel = document.getElementById('pinRoleLabel');
        const pinRoleIcon = document.getElementById('pinRoleIcon');
        const roleCardsContainer = document.getElementById('roleCardsContainer');
        const helloUserName = document.getElementById('helloUserName');
        const manageBtnContainer = document.getElementById('manageBtnContainer');
        const manageModal = document.getElementById('manageModal');
        const userPermList = document.getElementById('userPermList');

        // ---- Init ----
        function init() {
            renderUserCards();
            syncPermissions();
        }

        function syncPermissions() {
            // Sign in anonymously first for faster/reliable connection to database
            auth.signInAnonymously().then(() => {
                database.ref('user_permissions').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        userPermissions = data;
                        // Cache locally for next time (instant login)
                        localStorage.setItem('pis_cached_permissions', JSON.stringify(data));
                    }
                });
            }).catch(err => console.error("Firebase Login Error:", err));
        }

        function renderUserCards() {
            roleCardsContainer.innerHTML = '';
            USERS.forEach(user => {
                const card = document.createElement('div');
                card.className = 'role-card';
                card.setAttribute('data-user', user.id);
                card.style.setProperty('--accent', user.color);

                // Convert hex to rgb for rgba usage if needed, but we use hex here

                card.innerHTML = `
                    <div class="role-icon" style="background: ${user.color}22; color: ${user.color}">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="role-info">
                        <h3>${user.name}</h3>
                        ${user.isAdmin ? '<span class="manage-tag">Admin</span>' : '<span>Member</span>'}
                    </div>
                    <i class="fas fa-chevron-right role-arrow"></i>
                `;

                card.addEventListener('click', () => {
                    selectedUserObj = user;
                    showPinScreen();
                });

                roleCardsContainer.appendChild(card);
            });
        }

        function showPinScreen() {
            pinRoleLabel.textContent = selectedUserObj.name;
            helloUserName.textContent = selectedUserObj.name;
            pinRoleBadge.className = `pin-role-badge`;
            pinRoleBadge.style.background = `${selectedUserObj.color}22`;
            pinRoleBadge.style.color = selectedUserObj.color;
            pinRoleBadge.style.borderColor = `${selectedUserObj.color}44`;

            document.querySelectorAll('.pin-dot').forEach(d => {
                d.style.setProperty('--pin-color', selectedUserObj.color);
            });

            enteredPin = '';
            updateDots();
            pinError.textContent = '';

            roleScreen.style.display = 'none';
            pinScreen.style.display = 'block';
        }

        function showRoleScreen() {
            pinScreen.style.display = 'none';
            roleScreen.style.display = 'block';
            enteredPin = '';
        }

        // ---- Keypad ----
        document.querySelectorAll('.key-btn[data-val]').forEach(btn => {
            btn.addEventListener('click', () => {
                if (enteredPin.length >= 4) return;
                enteredPin += btn.getAttribute('data-val');
                updateDots();
                if (enteredPin.length === 4) {
                    setTimeout(checkPin, 300);
                }
            });
        });

        document.getElementById('delBtn').addEventListener('click', () => {
            enteredPin = enteredPin.slice(0, -1);
            updateDots();
            pinError.textContent = '';
        });

        document.getElementById('backBtn').addEventListener('click', showRoleScreen);

        function updateDots() {
            pinDots.forEach((dot, i) => {
                dot.classList.toggle('filled', i < enteredPin.length);
            });
        }

        function checkPin() {
            if (enteredPin === selectedUserObj.pin) {
                // Determine actual dashboard role
                let dashboardRole = ''; // No default role
                if (selectedUserObj.isAdmin) {
                    dashboardRole = 'fullaccess';
                    isPiyushOrVishal = true;
                } else {
                    dashboardRole = userPermissions[selectedUserObj.id] || '';
                }

                // Protect Access: If no role is assigned, don't let them in
                if (!dashboardRole) {
                    pinError.textContent = 'Access Denied: You have no assigned permissions. Contact Vishal or Piyush.';
                    enteredPin = '';
                    updateDots();
                    return;
                }

                // Save Role and User Info for Dashboard
                // Ensure accessRole is a string for the UI badge (Member or standard role)
                const roleString = (typeof dashboardRole === 'object') ? 'Member' : dashboardRole;
                localStorage.setItem('accessRole', roleString);
                localStorage.setItem('activeUserId', selectedUserObj.id);
                localStorage.setItem('activeUserName', selectedUserObj.name);

                // Allow this session to load once (on fresh login)
                sessionStorage.setItem('pis_session_active', 'true');

                // Direct login for everyone
                window.location.href = 'dashboard.html';
            } else {
                pinError.textContent = 'Incorrect PIN. Please try again.';
                enteredPin = '';
                updateDots();
                const dotContainer = document.getElementById('pinDots');
                dotContainer.style.animation = 'none';
                void dotContainer.offsetWidth;
                dotContainer.style.animation = 'shake 0.4s ease';
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (pinScreen.style.display !== 'block') return;
            if (e.key >= '0' && e.key <= '9') {
                if (enteredPin.length < 4) {
                    enteredPin += e.key;
                    updateDots();
                    if (enteredPin.length === 4) setTimeout(checkPin, 300);
                }
            } else if (e.key === 'Backspace') {
                enteredPin = enteredPin.slice(0, -1);
                updateDots();
                pinError.textContent = '';
            }
        });



        // Animated BG particles
        const particleContainer = document.getElementById('bgParticles');
        const pColors = ['#00c6ff', '#6366f1', '#f59e0b', '#10b981'];
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 80 + 20;
            p.style.cssText = `
                width:${size}px; height:${size}px;
                left:${Math.random() * 100}%;
                background:${pColors[Math.floor(Math.random() * pColors.length)]};
                animation-duration:${Math.random() * 15 + 10}s;
                animation-delay:${Math.random() * 10}s;
            `;
            particleContainer.appendChild(p);
        }

        init();
    </script>
</body>

</html>
